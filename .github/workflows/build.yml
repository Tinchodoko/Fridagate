name: Build FridaGate 2.0 APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fridagate2-main-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js for bundling Frida bridges
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build bundled Unity diagnostics agent
      run: |
        cd tools/unity-diagnostics
        npm install --no-audit --no-fund
        npm run build
        BUNDLE="../../app/src/main/assets/scripts/FridaGate_Unity_IL2CPP_Diagnostics.bundle.js"
        if grep -nE '^[[:space:]]*import[[:space:]]' "$BUNDLE"; then
          echo "ERROR: The generated agent still contains ES module imports."
          exit 1
        fi
        test -s "$BUNDLE"
        echo "Verified self-contained Frida agent bundle ($(wc -c < "$BUNDLE") bytes)."
        head -c 180 "$BUNDLE"; echo

    - name: Build bundled Java diagnostics agent
      run: |
        cd tools/java-diagnostics
        npm install --no-audit --no-fund
        npm run build
        BUNDLE="../../app/src/main/assets/scripts/FridaGate_Java_Diagnostics.bundle.js"
        if grep -nE '^[[:space:]]*import[[:space:]]' "$BUNDLE"; then
          echo "ERROR: The generated Java diagnostics agent still contains ES module imports."
          exit 1
        fi
        test -s "$BUNDLE"
        echo "Verified self-contained Java diagnostics bundle ($(wc -c < "$BUNDLE") bytes)."
        head -c 180 "$BUNDLE"; echo

    - name: Build bundled runtime diagnostics agent
      run: |
        cd tools/runtime-diagnostics
        npm install --no-audit --no-fund
        npm run build
        BUNDLE="../../app/src/main/assets/scripts/FridaGate_Runtime_Diagnostics.bundle.js"
        if grep -nE '^[[:space:]]*import[[:space:]]' "$BUNDLE"; then
          echo "ERROR: The runtime diagnostics bundle still contains ES module imports."
          exit 1
        fi
        test -s "$BUNDLE"
        echo "Verified runtime diagnostics bundle with frida-java-bridge ($(wc -c < "$BUNDLE") bytes)."

    - name: Commit generated bundles
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add \
          app/src/main/assets/scripts/FridaGate_Unity_IL2CPP_Diagnostics.bundle.js \
          app/src/main/assets/scripts/FridaGate_Java_Diagnostics.bundle.js \
          app/src/main/assets/scripts/FridaGate_Runtime_Diagnostics.bundle.js
        if git diff --cached --quiet; then
          echo "No bundle changes to commit."
        else
          git commit -m "ci: update generated bundles [skip ci]"
          git push
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Restore the permanent signing key from GitHub Actions secrets.
    # Never generate a replacement key: fail closed if the secret or fingerprint is wrong.
    - name: Restore and verify permanent signing key
      env:
        KEYSTORE_B64: ${{ secrets.FRIDAGATE_SIGNING_KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        if [ -z "${KEYSTORE_B64:-}" ]; then
          echo "::error::Missing repository secret FRIDAGATE_SIGNING_KEYSTORE_BASE64."
          exit 1
        fi

        mkdir -p "$HOME/.android"
        printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
        unset KEYSTORE_B64
        chmod 600 "$HOME/.android/debug.keystore"
        test -s "$HOME/.android/debug.keystore"

        KEY_INFO="$(keytool -list -v \
          -keystore "$HOME/.android/debug.keystore" \
          -storepass android \
          -alias androiddebugkey 2>/dev/null)" || {
            echo "::error::The configured signing keystore could not be opened."
            exit 1
          }

        ACTUAL_FINGERPRINT="$(printf '%s\n' "$KEY_INFO" | awk -F': ' '/SHA256:/ {print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
        EXPECTED_FINGERPRINT="BB9BF1F01A7B73272BE5B775EBADBAE6B00878029A5AC18D48C6B2E64B1A4D60"

        if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
          echo "::error::Signing keystore SHA-256 fingerprint does not match the expected permanent key."
          exit 1
        fi

        echo "Permanent signing keystore restored and fingerprint verified."

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # Verify the APK itself, not only the keystore restored earlier.
    - name: Verify APK is signed with the permanent certificate
      run: |
        set -euo pipefail
        APK="app/build/outputs/apk/debug/app-debug.apk"
        SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
        if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
          echo "::error::Could not locate Android apksigner to verify the built APK."
          exit 1
        fi
        CERT_INFO="$("$APKSIGNER" verify --print-certs "$APK")"
        printf '%s\\n' "$CERT_INFO"
        ACTUAL_CERT="$(printf '%s\\n' "$CERT_INFO" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
        EXPECTED_CERT="BB9BF1F01A7B73272BE5B775EBADBAE6B00878029A5AC18D48C6B2E64B1A4D60"
        if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
          echo "::error::The APK is not signed with the permanent FridaGate certificate."
          exit 1
        fi
        echo "Verified: APK certificate matches the permanent FridaGate signing key."

    - name: Verify Unity diagnostics bundle is packaged in APK
      run: |
        APK="app/build/outputs/apk/debug/app-debug.apk"
        ASSET="assets/scripts/FridaGate_Unity_IL2CPP_Diagnostics.bundle.js"
        if ! unzip -l "$APK" | grep -Fq "$ASSET"; then
          echo "ERROR: Unity diagnostics bundle is missing from the APK."
          exit 1
        fi
        unzip -p "$APK" "$ASSET" > /tmp/FridaGate_Unity_IL2CPP_Diagnostics.bundle.js
        test -s /tmp/FridaGate_Unity_IL2CPP_Diagnostics.bundle.js
        if grep -nE '^[[:space:]]*import[[:space:]]' /tmp/FridaGate_Unity_IL2CPP_Diagnostics.bundle.js; then
          echo "ERROR: The APK contains a bundle with unresolved ES module imports."
          exit 1
        fi
        echo "Verified Unity diagnostics bundle inside APK ($(wc -c < /tmp/FridaGate_Unity_IL2CPP_Diagnostics.bundle.js) bytes)."

    - name: Verify Java diagnostics bundle is packaged in APK
      run: |
        APK="app/build/outputs/apk/debug/app-debug.apk"
        ASSET="assets/scripts/FridaGate_Java_Diagnostics.bundle.js"
        if ! unzip -l "$APK" | grep -Fq "$ASSET"; then
          echo "ERROR: Java diagnostics bundle is missing from the APK."
          exit 1
        fi
        unzip -p "$APK" "$ASSET" > /tmp/FridaGate_Java_Diagnostics.bundle.js
        test -s /tmp/FridaGate_Java_Diagnostics.bundle.js
        if grep -nE '^[[:space:]]*import[[:space:]]' /tmp/FridaGate_Java_Diagnostics.bundle.js; then
          echo "ERROR: The APK contains a Java diagnostics bundle with unresolved ES module imports."
          exit 1
        fi
        echo "Verified Java diagnostics bundle inside APK ($(wc -c < /tmp/FridaGate_Java_Diagnostics.bundle.js) bytes)."

    - name: Verify runtime diagnostics bundle is packaged in APK
      run: |
        APK="app/build/outputs/apk/debug/app-debug.apk"
        ASSET="assets/scripts/FridaGate_Runtime_Diagnostics.bundle.js"
        if ! unzip -l "$APK" | grep -Fq "$ASSET"; then
          echo "ERROR: Runtime diagnostics bundle is missing from APK."
          exit 1
        fi
        unzip -p "$APK" "$ASSET" > /tmp/FridaGate_Runtime_Diagnostics.bundle.js
        test -s /tmp/FridaGate_Runtime_Diagnostics.bundle.js
        if grep -nE '^[[:space:]]*import[[:space:]]' /tmp/FridaGate_Runtime_Diagnostics.bundle.js; then
          echo "ERROR: APK contains unresolved imports in runtime diagnostics bundle."
          exit 1
        fi
        grep -q "Java.perform" /tmp/FridaGate_Runtime_Diagnostics.bundle.js
        echo "Verified runtime diagnostics bundle in APK."

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    # Publish each successful main-branch build so the app can fetch its APK directly.
    - name: Publish APK to GitHub Releases
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: FridaGate 2.0 Build ${{ github.run_number }}
        body: "Build automático ${{ github.run_number }} de FridaGate 2.0. Consulta README.md para funciones, requisitos y notas de compilación."
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/src/main/assets/scripts/FridaGate_Unity_IL2CPP_Diagnostics.bundle.js
          app/src/main/assets/scripts/FridaGate_Java_Diagnostics.bundle.js
          app/src/main/assets/scripts/FridaGate_Runtime_Diagnostics.js
          app/src/main/assets/scripts/FridaGate_Runtime_Diagnostics.bundle.js
        make_latest: true
