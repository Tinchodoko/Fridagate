name: Verificación de compilación Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificacion-compilacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compilar y ejecutar pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js para los agentes Frida
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restaurar clave de firma permanente
        env:
          KEYSTORE_B64: ${{ secrets.FRIDAGATE_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::Falta el secreto FRIDAGATE_SIGNING_KEYSTORE_BASE64."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          unset KEYSTORE_B64
          chmod 600 "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          echo "Clave de firma permanente restaurada."

      - name: Dar permisos al Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Verificar compilación y pruebas unitarias
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Publicar APK de verificación
        uses: actions/upload-artifact@v4
        with:
          name: FridaGate-2.0-verificacion-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
