name: Formato automático

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formato-${{ github.ref }}
  cancel-in-progress: false

env:
  KTLINT_VERSION: 1.8.0

jobs:
  format:
    name: Formatear Kotlin con ktlint
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Descargar ktlint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output ktlint \
            "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x ktlint
          ./ktlint --version

      - name: Aplicar formato automático
        shell: bash
        run: |
          set -uo pipefail

          # ktlint puede devolver código 1 aunque haya aplicado el formato,
          # porque algunas infracciones (por ejemplo, imports con *) requieren
          # cambios manuales. No bloquear por esos diagnósticos en este workflow.
          set +e
          ./ktlint \
            --editorconfig=.github/linters/.editorconfig \
            --format \
            "**/*.kt" "**/*.kts"
          ktlint_status=$?
          set -e

          if [ "$ktlint_status" -ne 0 ]; then
            echo "::warning::ktlint encontró infracciones que no pudo corregir automáticamente. Se continuará para guardar el formato aplicado; revisa los diagnósticos de este paso."
          fi

      - name: Guardar y subir cambios de formato
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- ':(glob)**/*.kt' ':(glob)**/*.kts'

          if git diff --cached --quiet; then
            echo "No hay cambios de formato para guardar."
            exit 0
          fi

          git commit -m "style: aplicar formato ktlint [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
