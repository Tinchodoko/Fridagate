name: Formato automático

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formato-${{ github.ref }}
  cancel-in-progress: false

env:
  KTLINT_VERSION: 1.8.0

jobs:
  format:
    name: Formatear Kotlin con ktlint
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Descargar ktlint
        run: |
          curl -fsSL -o ktlint \
            "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x ktlint
          ./ktlint --version

      - name: Aplicar formato
        run: |
          ./ktlint \
            --editorconfig=.github/linters/.editorconfig \
            --format \
            "app/src/**/*.kt" "*.kts" "app/*.kts"

      - name: Guardar y subir cambios de formato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Solo incluir archivos Kotlin que ktlint pueda haber modificado.
          git add -- '*.kt' '*.kts'

          if git diff --cached --quiet; then
            echo "El código ya cumple el formato de ktlint; no hay cambios para subir."
            exit 0
          fi

          git commit -m "style: aplicar formato ktlint [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
